[project]
name = "klhrms-api"
version = "1.0.0"
description = "KL HRMS — multi-tenant SaaS HRMS backend (FastAPI + PostgreSQL + Redis)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "greenlet>=3.0.3",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "alembic>=1.13.2",
  "python-json-logger>=2.0.7",
  "python-dotenv>=1.2.2",
  "openpyxl>=3.1.5",
  "reportlab>=4.5.0",
  "apscheduler>=3.10.4",
  "pdfplumber>=0.11.5",
  "python-docx>=1.1.2",
  "olefile>=0.47",
  "python-multipart>=0.0.29",
  "playwright>=1.60.0",
  "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
