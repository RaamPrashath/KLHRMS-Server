name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check app tests

      - name: Compile
        run: python -m compileall app alembic

      - name: Tests
        env:
          SKIP_STARTUP_DB: "true"
          REDIS_ENABLED: "false"
          OTEL_ENABLED: "false"
          AUTH_PROVIDER: "custom_jwt"
          JWT_SECRET_KEY: "ci-secret"
        run: pytest -q
